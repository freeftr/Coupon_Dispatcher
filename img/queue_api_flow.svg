<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="850" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Queue API Flow — Polling 기반 대기열</text>

  <!-- ==================== PHASE LABELS ==================== -->
  <rect x="30" y="60" width="1040" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="550" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Phase 1 — 관리자가 대기열 활성화</text>

  <rect x="30" y="195" width="1040" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="550" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Phase 2 — 사용자 대기열 진입</text>

  <rect x="30" y="400" width="1040" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Phase 3 — 스케줄러 배치 처리 (1초/10명)</text>

  <rect x="30" y="640" width="1040" height="32" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="550" y="662" text-anchor="middle" font-size="13" font-weight="bold" fill="#4338ca">Phase 4 — 사용자 결과 조회 (Polling)</text>

  <!-- ==================== ACTORS ==================== -->
  <!-- Column headers -->
  <text x="100" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Actor</text>
  <text x="320" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">API Server</text>
  <text x="580" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Redis</text>
  <text x="830" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">MySQL</text>
  <text x="1000" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Kafka</text>

  <!-- Vertical lifelines -->
  <line x1="100" y1="192" x2="100" y2="830" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="320" y1="192" x2="320" y2="830" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="580" y1="192" x2="580" y2="830" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="830" y1="192" x2="830" y2="830" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="1000" y1="192" x2="1000" y2="830" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== PHASE 1: Admin activates ==================== -->
  <!-- Admin → API -->
  <rect x="55" y="103" width="90" height="30" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.2" filter="url(#sh)"/>
  <text x="100" y="123" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">🔑 Admin</text>

  <line x1="145" y1="118" x2="265" y2="118" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="205" y="112" text-anchor="middle" font-size="9" fill="#16a34a">POST /queue/activate</text>

  <!-- API box -->
  <rect x="270" y="105" width="100" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="320" y="123" text-anchor="middle" font-size="10" fill="#15803d">validateAdmin</text>

  <!-- API → Redis -->
  <line x1="370" y1="118" x2="530" y2="118" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="450" y="112" text-anchor="middle" font-size="9" fill="#ef4444">SADD queue:active:coupons</text>

  <rect x="535" y="105" width="90" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="123" text-anchor="middle" font-size="10" fill="#b91c1c">SET ✓</text>

  <!-- Response -->
  <line x1="265" y1="150" x2="145" y2="150" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-g)"/>
  <text x="205" y="165" text-anchor="middle" font-size="9" fill="#16a34a">204 No Content</text>

  <!-- ==================== PHASE 2: User enters queue ==================== -->
  <rect x="55" y="240" width="90" height="30" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="100" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">👤 User</text>

  <!-- User → API -->
  <line x1="145" y1="255" x2="265" y2="255" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="205" y="249" text-anchor="middle" font-size="9" fill="#3b82f6">POST /queue?memberId=X</text>

  <!-- API → Redis (Lua) -->
  <rect x="270" y="280" width="100" height="42" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="320" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Lua Script</text>
  <text x="320" y="314" text-anchor="middle" font-size="9" fill="#3b82f6">원자적 진입</text>

  <line x1="370" y1="301" x2="530" y2="301" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="450" y="295" text-anchor="middle" font-size="9" fill="#ef4444">SISMEMBER → ZSCORE → ZADD</text>

  <!-- Redis response -->
  <rect x="535" y="285" width="90" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="303" text-anchor="middle" font-size="9" fill="#b91c1c">-1: 비활성</text>
  <text x="580" y="315" text-anchor="middle" font-size="9" fill="#b91c1c">-2: 중복</text>
  <text x="580" y="327" text-anchor="middle" font-size="9" fill="#16a34a">0+: 순번</text>

  <!-- Response to user -->
  <line x1="265" y1="345" x2="145" y2="345" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-b)"/>
  <rect x="135" y="350" width="150" height="35" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
  <text x="210" y="365" text-anchor="middle" font-size="9" fill="#1e40af">{ position: 0,</text>
  <text x="210" y="378" text-anchor="middle" font-size="9" fill="#1e40af">  estimatedWaitSeconds: 1 }</text>

  <!-- ==================== PHASE 3: Scheduler processes ==================== -->
  <rect x="270" y="445" width="100" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#sh)"/>
  <text x="320" y="465" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">⏱ Scheduler</text>

  <!-- Step 1: Pop from queue -->
  <line x1="370" y1="460" x2="530" y2="460" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="450" y="454" text-anchor="middle" font-size="9" fill="#ef4444">ZPOPMIN × 10</text>

  <rect x="535" y="448" width="90" height="28" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="580" y="466" text-anchor="middle" font-size="10" fill="#b91c1c">10명 pop</text>

  <!-- Step 2: issueCoupon → Redis -->
  <line x1="370" y1="500" x2="530" y2="500" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="450" y="494" text-anchor="middle" font-size="9" fill="#ef4444">issueCoupon Lua Script</text>

  <!-- Step 3: issueCoupon → MySQL -->
  <line x1="370" y1="530" x2="780" y2="530" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="575" y="524" text-anchor="middle" font-size="9" fill="#16a34a">INSERT CouponMember</text>

  <rect x="785" y="518" width="90" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="830" y="536" text-anchor="middle" font-size="10" fill="#15803d">DB 저장</text>

  <!-- Step 4: Publish event -->
  <line x1="370" y1="560" x2="950" y2="560" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="660" y="554" text-anchor="middle" font-size="9" fill="#7c3aed">publishEvent(CouponHistoryEvent)</text>

  <!-- Step 5: Save result -->
  <line x1="370" y1="590" x2="530" y2="590" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="450" y="584" text-anchor="middle" font-size="9" fill="#ef4444">SET result → SUCCESS (TTL 5m)</text>

  <!-- Sold out branch -->
  <rect x="420" y="608" width="200" height="25" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="520" y="625" text-anchor="middle" font-size="9" fill="#b91c1c">품절 시 → drainQueueAsSoldOut → deactivate</text>

  <!-- ==================== PHASE 4: User polls result ==================== -->
  <rect x="55" y="685" width="90" height="30" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1.2" filter="url(#sh)"/>
  <text x="100" y="705" text-anchor="middle" font-size="10" font-weight="600" fill="#4338ca">👤 User</text>

  <!-- Poll position -->
  <line x1="145" y1="695" x2="265" y2="695" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="205" y="689" text-anchor="middle" font-size="9" fill="#4338ca">GET /queue/position</text>

  <line x1="370" y1="695" x2="530" y2="695" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <text x="450" y="689" text-anchor="middle" font-size="9" fill="#ef4444">ZRANK</text>

  <line x1="265" y1="715" x2="145" y2="715" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="205" y="729" text-anchor="middle" font-size="9" fill="#4338ca">{ position: 3, estimatedWaitSeconds: 1 }</text>

  <!-- Polling loop indicator -->
  <rect x="50" y="745" width="160" height="22" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="130" y="760" text-anchor="middle" font-size="9" fill="#4338ca">🔄 2~3초 간격 반복 (Polling)</text>

  <!-- Poll result -->
  <line x1="145" y1="785" x2="265" y2="785" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="205" y="779" text-anchor="middle" font-size="9" fill="#4338ca">GET /queue/result</text>

  <line x1="370" y1="785" x2="530" y2="785" stroke="#ef4444" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <text x="450" y="779" text-anchor="middle" font-size="9" fill="#ef4444">GET result:{couponId}:{memberId}</text>

  <line x1="265" y1="805" x2="145" y2="805" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arr)"/>

  <rect x="135" y="810" width="150" height="30" rx="6" fill="#fff" stroke="#6366f1" stroke-width="1"/>
  <text x="210" y="823" text-anchor="middle" font-size="9" fill="#4338ca">{ status: "SUCCESS",</text>
  <text x="210" y="835" text-anchor="middle" font-size="9" fill="#4338ca">  message: "쿠폰이 발급되었습니다." }</text>
</svg>
